name: Deploy Web to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      verification_scope:
        description: "Verification profile"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.2"

      - name: Enable web
        run: flutter config --enable-web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install verification tooling
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Verify web deployment
        env:
          VERIFY_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_scope || 'quick' }}
        run: ./scripts/verify.sh

      - name: Build web
        run: >
          flutter build web
          --release
          --base-href "/${{ github.event.repository.name }}/"
          --web-resources-cdn
          --no-pub
          --no-wasm-dry-run

      - name: Stamp web asset version
        run: ./scripts/stamp_web_asset_version.sh build/web "${GITHUB_SHA}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
