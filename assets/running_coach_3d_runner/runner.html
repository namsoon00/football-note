<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b1220;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #status {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 18px;
      color: rgba(235, 241, 255, 0.86);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      background: #0b1220;
    }

    #hud {
      position: absolute;
      inset: 9px 10px auto 10px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      pointer-events: none;
    }

    .hud-panel {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #eaf0ff;
      font-size: 12px;
      font-weight: 800;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    }

    .hud-panel[data-side="target"] {
      text-align: right;
    }

    .swatch {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.20);
    }

    .label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .confidence {
      flex: 0 0 auto;
      color: rgba(235, 241, 255, 0.68);
      font-size: 11px;
    }

    #notice {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 8px;
      color: rgba(235, 241, 255, 0.58);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="hud" aria-hidden="true">
    <div class="hud-panel" data-side="current">
      <span class="swatch" id="currentSwatch"></span>
      <span class="label" id="currentLabel"></span>
      <span class="confidence" id="currentConfidence"></span>
    </div>
    <div class="hud-panel" data-side="target">
      <span class="confidence" id="targetConfidence"></span>
      <span class="label" id="targetLabel"></span>
      <span class="swatch" id="targetSwatch"></span>
    </div>
  </div>
  <div id="notice" aria-hidden="true"></div>
  <div id="status" role="status"></div>
  <script src="runner.js"></script>
</body>
</html>
